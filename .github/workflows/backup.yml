# Weekly encrypted backup of the app's data (the public schema).
# Needs two repository secrets: SUPABASE_DB_URL and BACKUP_PASSPHRASE (see README).
name: Weekly database backup

on:
  schedule:
    - cron: "30 20 * * 6" # Saturdays 20:30 UTC = Sundays 2:00 AM India time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump, compress and encrypt the database
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (see README)."
            exit 1
          fi

          file="family-portfolio-$(date -u +%Y-%m-%d).sql.gz.gpg"
          # pg_dump from the official Postgres 17 image, so it's never older than the database.
          docker run --rm -e PGURL="${SUPABASE_DB_URL}" postgres:17 \
            sh -c 'pg_dump "$PGURL" --schema=public --no-owner' \
            | gzip \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                --passphrase-file <(printf '%s' "${BACKUP_PASSPHRASE}") \
                --output "${file}"
          echo "BACKUP_FILE=${file}" >> "${GITHUB_ENV}"

      - name: Keep the encrypted backup for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
