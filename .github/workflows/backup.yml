# Weekly encrypted backup of the app's data, restorable in Settings → Backup & restore.
# Needs three repository secrets: BACKUP_URL, CRON_SECRET and BACKUP_PASSPHRASE (see README).
name: Weekly backup

on:
  schedule:
    - cron: "30 20 * * 6" # Saturdays 20:30 UTC = Sundays 2:00 AM India time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the export and encrypt it
        shell: bash
        env:
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_URL}" ] || [ -z "${CRON_SECRET}" ] || [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::Add the BACKUP_URL, CRON_SECRET and BACKUP_PASSPHRASE repository secrets (see README)."
            exit 1
          fi

          file="family-portfolio-$(date -u +%Y-%m-%d).backup.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BACKUP_URL%/}/api/backup" -o export.json
          node scripts/encrypt-backup.mjs < export.json > "${file}"
          rm export.json
          echo "BACKUP_FILE=${file}" >> "${GITHUB_ENV}"

      - name: Keep the encrypted backup for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
